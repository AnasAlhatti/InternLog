openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /openai/weekly-summary:
    post:
      operationId: summarizeWeek
      tags: [reports]
      summary: Summarize a selected week without storing journal notes on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklySummaryInput"
      responses:
        "200":
          description: AI-generated draft, requiring user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySummaryResult"
        "400":
          description: Invalid or out-of-week entries
        "403":
          description: Cross-origin requests are not permitted
        "413":
          description: Selected week exceeds the request size limit
        "429":
          description: Generation limit reached, retry later
        "502":
          description: AI provider did not return a usable summary
        "503":
          description: AI service is unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    WeeklySummaryInput:
      type: object
      required: [weekStart, entries]
      properties:
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SummaryEntry"
    SummaryEntry:
      type: object
      required: [date, title, tasks, learning, blockers, blockerStatus, nextSteps, hours, skills]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        title: { type: string, minLength: 1, maxLength: 500 }
        tasks: { type: string, minLength: 1, maxLength: 10000 }
        learning: { type: string, maxLength: 10000 }
        blockers: { type: string, maxLength: 10000 }
        blockerStatus: { type: string, enum: [open, resolved] }
        nextSteps: { type: string, maxLength: 10000 }
        hours: { type: number, minimum: 0, maximum: 24 }
        skills:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
    WeeklySummaryResult:
      type: object
      required: [summary]
      properties:
        summary: { type: string, minLength: 1, maxLength: 6000 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

