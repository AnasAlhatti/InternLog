name: InternLog checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/internlog test
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/internlog typecheck
      - run: pnpm --filter @workspace/internlog build
        env:
          PORT: 5173
          BASE_PATH: /
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/internlog exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/internlog test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: internlog-browser-failures
          path: generated-artifacts/internlog/
          retention-days: 7
